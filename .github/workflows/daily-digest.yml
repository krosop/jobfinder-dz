# Daily job refresh + Telegram digest, entirely in the cloud.
#
# Schedule: 05:00 UTC = 06:00 Algiers (UTC+1) / 06:30 in DST — adjust as needed.
# Runs on Ubuntu, commits the updated jobs.db back so `first_seen`/`times_seen`
# survive between runs (NEW vs REMAINING stays correct).
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   TELEGRAM_TOKEN    — the BotFather token
#   TELEGRAM_CHAT_ID  — your numeric chat id (e.g. 1643138088)
#
# The PC does NOT need to be on. Manual trigger: Actions → daily digest → Run.

name: daily digest

on:
  schedule:
    - cron: "0 5 * * *"        # 05:00 UTC daily
  workflow_dispatch: {}        # manual "Run workflow" button

permissions:
  contents: write              # needed to commit jobs.db back

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  refresh-and-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so the db commit-back never conflicts
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyMuPDF openpyxl "laya>=0.3.20" pytest

      - name: Restore jobs.db from previous run (if any)
        run: |
          # prefer the committed db; nothing to do — it IS the checkout.
          # keep a backup for the commit step.
          cp data/jobs.db data/jobs.db.bak 2>/dev/null || echo "no db yet"

      - name: Run daily refresh + digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p data
          # token from secret (file is gitignored; env var wins in CI)
          echo "$TELEGRAM_TOKEN" > data/telegram_token.txt
          python -m layajobs daily --pages 15
          python -m layajobs stats

      - name: Commit updated database
        if: always()
        run: |
          git config user.name "laya-jobs bot"
          git config user.email "actions@localhost"
          git add data/jobs.db data/source_status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no db changes"
          else
            git commit -m "chore(data): daily refresh $(date -u +%F)"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            data/reports/
            data/source_status.json
          retention-days: 14
