[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-jobs"
version = "0.1.0"
description = "Algerian print-press job-notice scraper: Laya-gated extraction into SQLite"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "PyMuPDF",
    "openpyxl",
    "pydantic",
    "laya>=0.3.20",
]

[project.scripts]
laya-jobs = "layajobs.cli:main"

[tool.setuptools.packages.find]
include = ["layajobs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
