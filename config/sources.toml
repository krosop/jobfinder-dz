# Algerian print-press sources for laya-jobs.
#
# kind:
#   epaper  - publishes downloadable daily PDF editions (primary target)
#   site    - HTML news site; classifieds may appear as articles
#   portal  - official gazette / agency portal (clean text, legally syndicated)
#
# status starts "unverified"; `laya-jobs verify` probes each source and upgrades it.
# enabled = false skips a source without deleting it.

[[sources]]
slug = "el-moudjahid"
name = "El Moudjahid"
name_ar = "المجاهد"
language = "fr"
kind = "epaper"
# Verified 2026-09-30: the homepage embeds the current issue PDF
# (elmoudjahid.com/storage/magazine/*.pdf); /fr/pdf/latest is a shell.
base_url = "https://www.elmoudjahid.dz/"
epaper_url = "https://www.elmoudjahid.dz/"
status = "verified"

