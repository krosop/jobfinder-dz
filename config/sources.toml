# ---------------------------------------------------------------------------
# Internet job sources (research round 2026-09-30; each status below was
# measured with a live probe — see data/source_status.json for evidence).
# kind "board"  = online job board (offers are HTML pages, not print PDFs)
# kind "portal" = official / aggregator site carrying concours announcements
# ---------------------------------------------------------------------------

# HIGH YIELD: 24 server-rendered job-offer links per listing page under
# /entreprises/<company>/offres-d-emploi/<sector>/<title-slug> (company and
# title are recoverable straight from the URL slug). Next.js site, plain
# requests works.
[[sources]]
slug = "emploitic"
name = "Emploitic"
language = "fr"
kind = "board"
base_url = "https://emploitic.com/"
epaper_url = "https://emploitic.com/offres-d-emploi"
status = "verified"

# Server-rendered enough to show job links; offers open in a JS drawer
# (JobDetailsDrawer) so detail pages need API reverse-engineering.
[[sources]]
slug = "emploipartner"
name = "Emploipartner"
language = "fr"
kind = "board"
base_url = "https://www.emploipartner.com/"
epaper_url = "https://www.emploipartner.com/fr/jobs/search"
status = "reachable"

[[sources]]
slug = "triemploi"
name = "Triemploi"
language = "fr"
kind = "board"
base_url = "https://triemploi.com/"
status = "reachable"

# Aggregators that render client-side (empty HTML shells; need JS or API).
[[sources]]
slug = "optioncarriere"
name = "Optioncarriere Algérie"
language = "fr"
kind = "board"
base_url = "https://www.optioncarriere.dz/"
status = "spa"

[[sources]]
slug = "ouedkniss-emploi"
name = "Ouedkniss Emploi"
language = "fr"
kind = "board"
base_url = "https://www.ouedkniss.com/"
# Highest-volume classifieds site in DZ; the /emploi_offres listing is a JS
# shell — reverse-engineer its JSON API before scraping.
status = "spa"

[[sources]]
slug = "algeriejob"
name = "Algeriejob"
language = "fr"
kind = "board"
base_url = "https://www.algeriejob.com/"
status = "blocked"

# National concours aggregator (WordPress, 244KB pages, FR/AR editions).
[[sources]]
slug = "jobsdz"
name = "JobsDZ (concours aggregator)"
language = "ar"
kind = "portal"
base_url = "https://jobsdz.com/"
status = "reachable"

# PDF e-paper hub: links the "version papier" of many Algerian dailies.
# Mapping its per-paper URLs is the fastest way to recover the epaper PDF
# URLs for sources still unverified above.
[[sources]]
slug = "pressealgerie"
name = "PresseAlgérie (e-paper hub)"
language = "fr"
kind = "portal"
base_url = "https://pressealgerie.fr/"
status = "reachable"

# Dedicated national concours portal (reachable over plain http; the JS
